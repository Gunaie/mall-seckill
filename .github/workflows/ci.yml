# mall-seckill CI：测试门禁（71 个单元/集成用例）-> 打包 -> 镜像构建校验
# 集成测试使用 JVM 内嵌 Redis（embedded-redis），runner 无需 Docker/MySQL/RabbitMQ
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and package
        # verify 阶段执行全部用例（71），测试失败即中断流水线；同时产出可运行 fat jar
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: mall-seckill-jar
          path: target/mall-seckill.jar
          if-no-files-found: error

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仅验证多阶段 Dockerfile 可构建（BuildKit 默认开启，支持 Dockerfile 内 cache mount）；
      # 未配置镜像仓库，故不 push
      - name: Build application image
        run: docker build -t mall-seckill:${{ github.sha }} .
