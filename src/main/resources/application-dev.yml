# 开发环境配置
spring:
  data:
    redis:
      # 容器 Redis 宿主机映射端口为 6380
      host: localhost
      port: 6380
      password: mall123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  # RabbitMQ（订单超时延迟关单 / 秒杀异步下单）
  rabbitmq:
    host: localhost
    port: 5672
    username: mall
    password: mall123456
    virtual-host: /
    # 发送方确认：消息抵达 broker 后异步回调，失败可感知（可靠投递）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 消费端手动 ACK，业务失败可控（不自动 requeue 形成毒消息循环）
        acknowledge-mode: manual
        prefetch: 10
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 容器 MySQL 宿主机映射端口为 13306
    url: jdbc:mysql://localhost:13306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin123

# MyBatis-Plus
mybatis-plus:
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL，生产环境关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
mall:
  # 接口限流总开关：压测时置 false 排除限流层干扰，生产必须 true
  access-limit:
    enabled: true
  # 商品缓存：基础 TTL 30 分钟 + 0~10 分钟随机抖动（防雪崩）；空值缓存 2 分钟（防穿透）
  cache:
    spu-detail-ttl: 1800
    spu-detail-ttl-jitter: 600
    # Caffeine 本地一级缓存 TTL（秒），应小于 Redis 二级缓存 TTL
    spu-detail-local-ttl: 300
    null-value-ttl: 120
    category-tree-ttl: 3600
  # 订单相关参数
  order:
    # 待支付订单超时时间（秒）。演示环境 60s 便于观察自动关单；生产环境通常 1800（30 分钟）
    timeout-seconds: 60
    # 下单幂等令牌有效期（秒）
    token-ttl-seconds: 600
  # 秒杀参数
  seckill:
    # 本地内存售罄标记开关；压测对比时置 false 重启，观察 QPS 差异
    local-mark-enabled: true
    # 秒杀结果轮询 key 有效期（秒）
    result-ttl-seconds: 600
    # 当日场次列表缓存 TTL（秒）
    sessions-cache-ttl-seconds: 60
    # 验证码有效期（秒）
    captcha-ttl-seconds: 120
    # 动态下单路径有效期（秒）
    path-ttl-seconds: 60
    # 动态路径 MD5 盐值，生产环境通过环境变量覆盖
    path-salt: mall-seckill-path-salt-2026
    # 验证码开关：压测时置 false，脚本可直接换取动态路径
    captcha-enabled: true
  jwt:
    # HS256 密钥，生产环境通过环境变量覆盖（至少 32 字节）
    secret: mall-seckill-jwt-secret-key-2026-must-be-long-enough
    # access token 有效期：2 小时（秒）
    access-token-expiration: 7200
    # refresh token 有效期：7 天（秒）
    refresh-token-expiration: 604800

logging:
  level:
    com.mall: debug
    org.springframework.web: info
