# mall-seckill Nginx：托管前端静态资源 + 双实例后端负载均衡
user nginx;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    # 上游慢节点熔断：失败 2 次后 10s 内不再分发
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 双应用实例（compose 容器网络内主机名）
    upstream mall_backend {
        server app1:8080 max_fails=2 fail_timeout=10s;
        server app2:8080 max_fails=2 fail_timeout=10s;
        # 上游长连接，降低频繁建连开销
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 前端静态资源（Vue build 产物）
        root /usr/share/nginx/html;
        index index.html;

        # API / 接口文档 / actuator 全部转发至后端集群
        location ~ ^/(api|doc\.html|v3|actuator|webjars|swagger-resources) {
            proxy_pass http://mall_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 限流 IP 维度依赖此头还原客户端真实 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # SPA 路由回退：非 API/静态资源的请求统一返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
