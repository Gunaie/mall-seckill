# RocketMQ Broker 配置（单机 Docker 演示用）
# 事务消息依赖：transactionCheckInterval（Broker 回查间隔）、transactionTimeOut（半消息超时）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 容器网络内固定 IP，避免 Broker 向客户端注册容器随机 IP 导致应用连不上
brokerIP1 = rocketmq-broker
listenPort = 10911

# 演示环境自动建 Topic / 消费组，省去手工创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 事务消息：半消息 6s 未确认即回查，Broker 每 10s 扫描一次待回查事务
transactionTimeOut = 6000
transactionCheckInterval = 10000
transactionCheckMax = 15
